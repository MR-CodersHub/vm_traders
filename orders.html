<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Traders | My Orders</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Icon Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="assets/js/api.js"></script>
    <script src="assets/js/icons.js"></script>
    <style>
        /* ---- Dashboard page scoped styles ---- */
        body.dashboard-layout .nav-links { display: none !important; }
        body.dashboard-layout .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
        body.dashboard-layout .navbar .logo { margin-left: 0; }
        body.dashboard-layout .navbar .sidebar-toggle { margin-right: 0; }

        .dashboard-container { padding: 24px 0; background-color: var(--light-orange); width: 100%; max-width: 100%; min-height: unset; overflow-x: hidden; }
        .dashboard-grid { display: grid; grid-template-columns: 260px 1fr; gap: 30px; align-items: start; width: 100%; max-width: 100%; }
        .sidebar { background: var(--white); padding: 28px 24px; border-radius: 12px; box-shadow: var(--shadow-sm); position: sticky; top: 80px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 6px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; color: var(--text-dark); text-decoration: none; padding: 11px 14px; border-radius: 8px; font-weight: 500; font-size: 0.95rem; transition: var(--transition); }
        .sidebar-menu a i { font-size: 1.1rem; width: 20px; text-align: center; flex-shrink: 0; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--light-orange); color: var(--primary-orange); }
        .sidebar-menu .logout-link a { color: #e74c3c; }
        .sidebar-menu .logout-link a:hover { background-color: rgba(231, 76, 60, 0.08); color: #c0392b; }

        .main-content { background: var(--white); padding: 18px; border-radius: 12px; box-shadow: var(--shadow-sm); width: 100%; max-width: 100%; overflow-x: hidden; }
        .page-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table th, .orders-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .orders-table th { color: var(--text-light); font-weight: 600; }

        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
        .status-delivered { background-color: #d4edda; color: #155724; }
        .status-shipped { background-color: #cce5ff; color: #004085; }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-packed { background-color: #e3f2fd; color: #1976d2; }

        .order-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .order-modal.show { display: flex; animation: fadeIn 0.3s ease; }
        .order-modal-content { background: var(--white); padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light); }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .empty-orders { text-align: center; padding: 40px 20px; font-size: 1.1rem; color: var(--text-light); }

        @media (max-width: 992px) { .dashboard-grid { grid-template-columns: 1fr; } .main-content { padding: 8px; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="dashboard-layout">
    <canvas id="bg-canvas"></canvas>
    
    <!-- Order Details Modal -->
    <div class="order-modal" id="order-details-modal">
        <div class="order-modal-content">
            <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 20px; color: var(--dark-orange);">Order Details</h3>
            
            <div id="modal-order-summary" style="padding-bottom: 20px; border-bottom: 1px dashed var(--border-color); margin-bottom: 20px;">
                <!-- Summary Data -->
            </div>

            <div id="modal-order-items">
                <!-- Items list -->
            </div>

            <div id="modal-order-total" style="margin-top: 25px; padding-top: 20px; border-top: 2px solid var(--border-color); font-weight: 700; font-size: 1.2rem; display: flex; justify-content: space-between;">
                <span>Total Amount:</span>
                <span style="color: var(--primary-orange);">₹0.00</span>
            </div>
        </div>
    </div>
    <div class="page-wrapper">
        <!-- Header: dashboard version — logo only + logout -->
        <header>
            <div class="container">
                <nav class="navbar">
                    
                    <a href="index.html" class="logo">
                        VM Traders
                    </a>
                    <!-- nav-links intentionally omitted on dashboard pages -->
                    <div class="nav-icons">
                        
                        <div class="user-dropdown-container">
                            <button class="user-dropdown-toggle"><i class="fa-solid fa-user"></i></button>
                            <div class="user-dropdown-menu">
                                <a href="login.html" class="user-dropdown-item">Login / Sign Up</a>
                                <div class="user-dropdown-divider"></div>
                                <a href="admin-dashboard.html" class="user-dropdown-item">Admin Dashboard</a>
                                <a href="user-dashboard.html" class="user-dropdown-item">User Dashboard</a>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        <main class="dashboard-container">
            <div class="container">
                <div class="dashboard-grid">
                    <!-- Sidebar -->
                    <aside class="sidebar">
                        <ul class="sidebar-menu">
                            <li><a href="user-dashboard.html"><i class="fa-solid fa-house"></i> Overview</a></li>
                            <li><a href="orders.html" class="active"><i class="fa-solid fa-box"></i> My Orders</a></li>
                            <li><a href="wishlist.html"><i class="fa-regular fa-heart"></i> Wishlist</a></li>
                            <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile Settings</a></li>
                            <li class="logout-link"><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
                        </ul>
                    </aside>

                    <!-- Content -->
                    <section class="main-content">
                        <div class="page-header">
                            <h2>My Orders</h2>
                            <p style="color: var(--text-light);">View and track all your recent purchases.</p>
                        </div>

                        <div style="overflow-x: auto;">
                            <table class="orders-table">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Populated by assets/js/orders.js -->
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer style="background: var(--dark-orange); color: var(--white); padding: 40px 0; text-align: center;">
            <div class="container">
                <p>&copy; 2026 VM Traders. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/shop.js"></script>
    <script src="assets/js/mobile-nav.js"></script>
    <script src="assets/js/background.js"></script>
    <script src="assets/js/orders.js"></script>
</body>

</html>
